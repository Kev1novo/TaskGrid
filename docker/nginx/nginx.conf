# 阶段 7：TaskGrid 生产 nginx 配置
# 反向代理到 web:8000 + 静态文件 + gzip + 请求体限制

server {
    listen 80;
    server_name _;

    # 用户提交的代码走 JSON body，给 10m 上限
    client_max_body_size 10m;

    # gzip：API 返回 JSON、浏览页返回 HTML
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml text/javascript;

    # Django 静态文件（admin / DRF 浏览 API / Swagger）由 nginx 直接服务
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 其余全部反向代理到 web（gunicorn）
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
